name: CI Security Pipeline

# Trigger the pipeline on push and pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout source code from repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Secret Scanning using Gitleaks
    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      with:
        # Fail the build if any secrets are detected
        fail: true

    # Step 3: Software Composition Analysis using OWASP Dependency-Check
    - name: Run OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "DevOps-Lab-Security"
        path: "."
        format: "HTML"
        out: "dependency-check-report"
        args: >
          --failOnCVSS 7
          --enableExperimental

    # Step 4: Upload Dependency-Check Report as Artifact
    - name: Upload Dependency Check Report
      uses: actions/upload-artifact@v4
      with:
        name: Dependency-Check-Report
        path: dependency-check-report
